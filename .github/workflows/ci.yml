name: CI

# Thin shim around the OxideAV org-level reusable workflow. See
# https://github.com/OxideAV/.github for the actual job definitions and
# the input surface. Miri runs by default per the org-wide policy.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: OxideAV/.github/.github/workflows/crate-ci.yml@master
    secrets: inherit
    with:
      # Run the test suite with every feature on so the non-default
      # `mock` backend (the hardware-free state-machine coverage in
      # tests/mock_backend.rs) is exercised on the headless runners.
      extra_test_args: "--all-features"
